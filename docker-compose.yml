# Supabase externe uniquement. Ne contient aucun runner étudiant ou service vidéo.
services:
  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      target: api
    env_file: .env
    environment:
      APP_MODE: supabase
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      target: web
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
